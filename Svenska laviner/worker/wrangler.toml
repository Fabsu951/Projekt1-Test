name = "fjallkoll-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Records each day's danger levels shortly after lavinprognoser.se publishes
# (08:00 and 18:00 Swedish time; UTC hours cover both winter and summer time).
[triggers]
crons = ["20 6,7,16,17 * * *"]

[vars]
ALLOWED_ORIGIN = "*"
# Public site URL, used in links in emails.
APP_URL = "https://fjallkoll.pages.dev"
# Contact given to browser push services with each notification (VAPID).
# The keys themselves are secrets, created by: node scripts/setup-push.mjs
VAPID_SUBJECT = "mailto:fabian.n.sund@gmail.com"
# Sender for verification/reset emails; must be on a domain verified in
# Resend. Emails are only sent once the RESEND_API_KEY secret is set too:
#   npx wrangler secret put RESEND_API_KEY
# EMAIL_FROM = "Toppkoll <noreply@example.se>"

# User accounts + observations, stored in the EU. Create once with:
#   npx wrangler d1 create fjallkoll --jurisdiction eu
# and paste the printed database_id below, then apply the schema:
#   npx wrangler d1 migrations apply fjallkoll --remote
[[d1_databases]]
binding = "DB"
database_name = "fjallkoll"
database_id = "46459915-5ba5-475c-a83f-5da13c873b42"
migrations_dir = "migrations"

# Observation photos, stored in the EU. Create once with:
#   npx wrangler r2 bucket create fjallkoll-images --jurisdiction eu
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "fjallkoll-images"
jurisdiction = "eu"
