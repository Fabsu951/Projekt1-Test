import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Every commit gets a higher version number, so a new build always installs
// over the previous one (GitHub's build and Android Studio alike).
static int gitCommitCount(File dir) {
    try {
        def out = ['git', 'rev-list', '--count', 'HEAD'].execute(null, dir).text.trim()
        return out.isInteger() ? out.toInteger() : 1
    } catch (ignored) {
        return 1
    }
}

android {
    namespace = "se.snolage.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "se.snolage.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gitCommitCount(rootDir)
        // The Play release build sets the version name (.github/workflows/android-release.yml).
        versionName System.getenv("SNOLAGE_VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // One debug key for every test build, kept in the repo, so the APK
        // GitHub builds (.github/workflows/android.yml) and one built in
        // Android Studio can replace each other on the phone. Only for test
        // builds: the Play Store release gets its own key, never in git.
        debug {
            storeFile file('snolage-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The upload key for Google Play: only on GitHub, from repository
        // secrets (android-release.yml). Never in git, never in chat.
        if (System.getenv("SNOLAGE_UPLOAD_STORE_FILE")) {
            release {
                storeFile file(System.getenv("SNOLAGE_UPLOAD_STORE_FILE"))
                storePassword System.getenv("SNOLAGE_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("SNOLAGE_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("SNOLAGE_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv("SNOLAGE_UPLOAD_STORE_FILE")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
        // Health Connect's feature check is marked experimental in some versions.
        freeCompilerArgs.add("-opt-in=androidx.health.connect.client.feature.ExperimentalFeatureAvailabilityApi")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // HealthRoutesPlugin (asks for one workout's GPS route). Keep the same
    // version as node_modules/capacitor-health/android/build.gradle.
    implementation 'androidx.health.connect:connect-client:1.2.0-alpha01'
    // The hourly check for new sessions from the watch (HealthCheckWorker).
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
