<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icons/icon-48.webp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1418" />
    <script>
      // Light/dark and field mode before the first paint (see src/services/appearance.ts).
      try {
        var t = localStorage.getItem("fjallkoll:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("fjallkoll:field-mode") === "1") document.documentElement.dataset.field = "on";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Dagens lavinprognos för svenska fjällen på ett ställe: farograd, lavinproblem, fjällväder och vind för Kebnekaise, Riksgränsen, Vindelfjällen, Lapplandsfjällen, Jämtland och Härjedalen. Med karta, observationer och turer."
    />
    <link rel="canonical" href="https://snolage.se/" />
    <!-- How links to snolage.se look when shared (Facebook, Messenger, Slack, iMessage …). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Snöläge" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:url" content="https://snolage.se/" />
    <meta property="og:title" content="Snöläge – lavinprognos och turer" />
    <meta
      property="og:description"
      content="Dagens farograd, lavinproblem, fjällväder, karta och observationer för svenska fjällen – på ett ställe."
    />
    <meta property="og:image" content="https://snolage.se/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Snöläge – lavinprognos och turer i svenska fjällen" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Snöläge",
        "alternateName": "Snolage",
        "url": "https://snolage.se/",
        "inLanguage": "sv-SE",
        "description": "Lavinprognos, väder, karta och turer för skidåkning i svenska fjällen."
      }
    </script>
    <title>Snöläge – lavinprognos och turer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
