centric: faster sliding means fewer attached cross-bridges. Eccentric: the cross-bridges and elastic components resist the stretch and help braking."}, {"n": 18, "g": "Week 2 — Muscles", "q": "At what fraction of v_max is muscle power maximal?", "a": "About one-third of v_max (and about one-third of F_max)."}, {"n": 19, "g": "Week 2 — Muscles", "q": "Optimal sarcomere length range?", "a": "About 70–130 % of resting length. Pennate muscles peak at 120–130 %."}, {"n": 20, "g": "Week 2 — Muscles", "q": "SSC phases?", "a": "Eccentric pre-stretch (store energy in the SEC/tendon), then a short amortization, then a concentric phase with the elastic recoil added."}, {"n": 21, "g": "Week 2 — Muscles", "q": "Type I vs IIx fibres?", "a": "I: slow, small, red, aerobic, fatigue-resistant, many mitochondria and capillaries. IIx: fast, large, white, anaerobic, fatigues easily."}, {"n": 22, "g": "Week 2 — Muscles", "q": "Three elements of the musculotendinous model?", "a": "Contractile component (fibres), series elastic component (tendon), parallel elastic component (membrane and connective tissue)."}, {"n": 23, "g": "Week 2 — Muscles", "q": "Agonist, synergist, antagonist and neutralizer for elbow flexion?", "a": "Agonists: biceps brachii and brachialis. Synergist: brachioradialis. Antagonist: triceps brachii. Neutralizer: pronator teres cancels the biceps' supination when only flexion is wanted."}, {"n": 24, "g": "Week 2 — Muscles", "q": "Why does a pennate muscle give more force than a parallel one of the same volume? Give the slide numbers.", "a": "A = V/L_f, so short fibres give a much larger area. Slide example: fibre length 10 vs 1 unit at 0° vs 20° gives effective area 0.1 V vs 0.94 V, about 9× the force. The cos α loss is small."}, {"n": 25, "g": "Week 3 — Skeletons and springs", "q": "Hydrostatic skeleton vs muscular hydrostat?", "a": "Hydrostatic skeleton: a fluid-filled cavity inside a muscle wall (worm). Muscular hydrostat: a solid, incompressible mass of muscle at con ending axis carries the load best. With the same cross-sectional area, a tube of outer radius 2r₀ has 7× the second moment of area of a solid rod of radius r₀. That is why exoskeletons are tubes."}, {"n": 35, "g": "Week 3 — Skeletons and springs", "q": "What happens to a McKibben muscle's braid angle as it is inflated, and when does it stop pulling?", "a": "θ (from the long axis) increases as the diameter grows and the length shrinks. It stops at 54.7°, where F = 0 and the volume is maximum. Starting above 54.7°, inflation extends it instead."}, {"n": 36, "g": "Week 4 — Walking", "q": "Maximum walking speed, and its value for L = 0.9 m?", "a": "√(gL) = 2.97 m/s. Moon: 1.2 m/s."}, {"n": 37, "g": "Week 4 — Walking", "q": "Duty factor for walking vs running, and for a tortoise?", "a": "Walking > 0.5, running < 0.5. Tortoise 0.75."}, {"n": 38, "g": "Week 4 — Walking", "q": "Synthetic-wheel key number?", "a": "ω_F τ = 4.058, so the duty factor is ≈ 0.65 ≈ ⅔, and the period does not depend on step length."}, {"n": 39, "g": "Week 4 — Walking", "q": "Pendulum frequency of a uniform leg?", "a": "f = (1/2π)√(3g/2L), so T = 2π√(2L/3g)."}, {"n": 40, "g": "Week 4 — Walking", "q": "EMA of a crouched vs a straight leg?", "a": "Crouched (Z-shape): EMA = r/R ≪ 1, distance advantage. Straight (L-shape): EMA near 1, good weight support."}, {"n": 41, "g": "Week 4 — Walking", "q": "Why must a child run to keep up with an adult who is walking?", "a": "v_max = √(gL). A child with L = 0.45 m can walk at most ≈ 2.1 m/s, while an adult with L = 0.9 m can walk up to ≈ 2.97 m/s."}, {"n": 42, "g": "Week 4 — Walking", "q": "Advantages of legs over wheels?", "a": "Legs handle variable terrain and obstacles, are energy efficient, can be driven by linear muscles, and need no perpetual rotation or gears. A wheel keeps the centre of mass level but needs a prepared surface."}, {"n": 43, "g": "Week 5 — Running and jumping", "q": "Walk vs run: GRF pattern and knee?", "a": "Walking: two humps (plateau when slow) and a straight stance knee. Running: one hump (≈ 2.7–3.6 mg) and a knee that is never straight."}, {"n": 44, "g": "Week 5 — Running and jumping", "q": "Energetic walk-run crossover?", "a": "About 2.3 m/s. Walking power ∝ v² and running power ∝ v, so the curves cross."}, {"n": 45, "g": "Week 5 — Running and jumping", "q": "Sprint top speed formula?", "a": "v_final = √(2FL/m_leg): at top speed all the stride work goes into re-accelerating a leg."}, {"n": 46, "g": "Week 5 — Running and jumping", "q": "Jump height formula, and take-off time?", "a": "H = (N − mg)s/(mg). τ = √(2s/a) with a = (N − mg)/m."}, {"n": 47, "g": "Week 5 — Running and jumping", "q": "How much energy does the Achilles tendon store per step at marathon pace?", "a": "About 35 J of about 100 J lost per foot strike, with about 93 % recoverable."}, {"n": 48, "g": "Week 5 — Running and jumping", "q": "Phases of the running cycle, with percentages?", "a": "Stance ≈ 40 % (from foot strike), then float ≈ 15 %, swing ≈ 30 %, float ≈ 15 % until the next foot strike. The stance knee never fully straightens."}, {"n": 49, "g": "Week 5 — Running and jumping", "q": "Four stages of the stick-man vertical jump?", "a": "Stand upright (COM ≈ 1.0 m) → crouch (COM ≈ 0.65 m) → extend onto tiptoe (COM ≈ 1.05 m, take-off at v_TO) → free flight up to height H, where v = 0."}, {"n": 50, "g": "Week 5 — Running and jumping", "q": "Why are ostriches better runners than humans?", "a": "Mostly slow-twitch muscle for endurance, long (≈ 80 cm) tendons that store ≈ 83 % more elastic work, muscle mass kept high on the leg (light distal leg), and they run on their toes."}]</script>
<script>
(function () {
  const CARDS = JSON.parse(document.getElementById('data').textContent);
  const GROUPS = [
    { key: 'g1',  match: 'Week 1 ',  name: 'V1 Robotar' },
    { key: 'g2',  match: 'Week 2 ',  name: 'V2 Muskler' },
    { key: 'g3',  match: 'Week 3 ',  name: 'V3 Skelett & fjädrar' },

  CARDS.forEach(c => { const g = GROUPS.find(g => c.g.startsWith(g.match)); c.key = g.key; c.gname = g.name; });

  const STORE = 'srf-marks-v2';
  let marks = {};
  try { marks = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { marks = {}; }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) {} };

  const state = { groups: new Set(GROUPS.map(g => g.key)), onlyMissed: false, shuffled: false, mode: 'card', order: [], pos: 0, revealed: false, open: new Set() };

  function deck() {
    return CARDS.filter(c => state.groups.has(c.key) && (!state.onlyMissed || marks[c.n] === 'm'));
  }
  function rebuild(keepCurrent) {
    const cur = state.order[state.pos];
    let d = deck().map(c => c.n);
    if (state.shuffled) for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
    state.order = d;
    const idx = keepCurrent ? d.indexOf(cur) : -1;
    state.pos = idx >= 0 ? idx : 0;
    state.revealed = false;
    render();
  }

  function renderChips() {
    $('chips').innerHTML = GROUPS.map(g => {
      const n = CARDS.filter(c => c.key === g.key).length;
      return `<button class="chip ${g.key}" data-g="${g.key}" aria-pressed="${state.groups.has(g.key)}">${g.name} <span class="ct">${n}</span></button>`;
    }).join('');
  }
  function renderStats() {
    const d = CARDS.filter(c => state.groups.has(c.key));
    const k = d.filter(c => marks[c.n] === 'k').length, m = d.filter(c => marks[c.n] === 'm').length, total = d.length;
    $('statline').innerHTML = `<span class="k"><b>${k}</b> kunde</span><span class="m"><b>${m}</b> missade</span><span><b>${total - k - m}</b> ej gjorda</span><span>av <b>${total}</b> valda kort</span>`;
    $('barK').style.width = total ? (100 * k / total) + '%' : '0';
    $('barM').style.width = total ? (100 * m / total) + '%' : '0';
  }
  function badge(n) {
    return marks[n] === 'k' ? '<span class="badge k">Kunde</span>' : marks[n] === 'm' ? '<span class="badge m">Missade</span>' : '';
  }
  function renderCard() {
    if (!state.order.length) {
      $('stage').innerHTML = `<div class="empty">${state.onlyMissed ? 'Inga missade kort bland de valda veckorna. Snyggt! Stäng av “Bara missade” för att köra alla.' : 'Välj minst en vecka ovan.'}</div>`;
      return;
    }
    const c = CARDS.find(x => x.n === state.order[state.pos]);
    $('stage').innerHTML = `
      <article class="card ${c.key}" aria-live="polite">
        <div class="card-top"><span class="wk">${c.gname}</span>${badge(c.n)}<span class="num">#${c.n} · ${state.pos + 1} / ${state.order.length}</span></div>
        <h2 class="q">${esc(c.q)}</h2>
        ${state.revealed
          ? `<div class="ans">${esc(c.a)}</div>
             <div class="grade"><button class="yes" id="gk">✓ Kunde</button><button class="no" id="gm">✗ Missade</button></div>`
          : `<button class="reveal" id="rev">Visa svar <small>· klicka eller tryck mellanslag</small></button>`}
        <div class="nav"><button class="btn" id="prev">← Föregående</button><button class="btn" id="next">Nästa →</button></div>
      </article>
      <p class="keys"><kbd>Mellanslag</kbd> visa svar · <kbd>1</kbd> kunde · <kbd>2</kbd> missade · <kbd>←</kbd> <kbd>→</kbd> bläddra</p>`;
  }
  function renderList() {
    if (!state.order.length) { renderCard(); return; }
    $('stage').innerHTML = `<div class="list">${state.order.map(n => {
      const c = CARDS.find(x => x.n === n), open = state.open.has(n);
      return `<div class="row ${c.key}"><button data-n="${n}" aria-expanded="${open}"><span class="n">#${n}</span><span class="t">${esc(c.q)}</span>${badge(n)}<span class="hint">${open ? 'dölj' : 'visa svar'}</span></button>${open ? `<div class="a">${esc(c.a)}</div>` : ''}</div>`;
    }).join('')}</div>`;
  }
  function render() {
    renderChips(); renderStats();
    $('modeCard').setAttribute('aria-pressed', state.mode === 'card');
    $('modeList').setAttribute('aria-pressed', state.mode === 'list');
    $('onlyMissed').setAttribute('aria-pressed', state.onlyMissed);
    $('shuffle').setAttribute('aria-pressed', state.shuffled);
    state.mode === 'card' ? renderCard() : renderList();
  }

  function go(delta) {
    if (!state.order.length) return;
    state.pos = (state.pos + delta + state.order.length) % state.order.length;
    state.revealed = false; renderCard();
  }
  function grade(v) {
    const n = state.order[state.pos];
    marks[n] = v; save(); renderStats();
    if (state.onlyMissed && v === 'k') {           // card leaves the missed pile
      state.order.splice(state.pos, 1);
      if (state.pos >= state.order.length) state.pos = 0;
      state.revealed = false; renderCard();
    } else go(1);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.g) { state.groups.has(t.dataset.g) ? state.groups.delete(t.dataset.g) : state.groups.add(t.dataset.g); rebuild(true); return; }
    if (t.dataset.n) { const n = +t.dataset.n; state.open.has(n) ? state.open.delete(n) : state.open.add(n); renderList(); return; }
    switch (t.id) {
      case 'rev': state.revealed = true; renderCard(); break;
      case 'gk': grade('k'); break;
      case 'gm': grade('m'); break;
      case 'prev': go(-1); break;
      case 'next': go(1); break;
      case 'modeCard': state.mode = 'card'; render(); break;
      case 'modeList': state.mode = 'list'; render(); break;
      case 'onlyMissed': state.onlyMissed = !state.onlyMissed; rebuild(false); break;
      case 'shuffle': state.shuffled = !state.shuffled; rebuild(false); break;
      case 'reset':
        $('resetWrap').innerHTML = '<span class="confirm">Radera alla markeringar? <button class="btn" id="resetYes">Ja, nollställ</button><button class="btn" id="resetNo">Avbryt</button></span>'; break;
      case 'resetYes': marks = {}; save(); $('resetWrap').innerHTML = '<button class="btn" id="reset">Nollställ</button>'; rebuild(false); break;
      case 'resetNo': $('resetWrap').innerHTML = '<button class="btn" id="reset">Nollställ</button>'; break;
    }
  });
  document.addEventListener('keydown', e => {
    if (state.mode !== 'card' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('.chips, .toolbar')) return;
    if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    if ((e.key === ' ' || e.key === 'Enter') && !state.revealed && state.order.length) { e.preventDefault(); state.revealed = true; renderCard(); }
    else if (e.key === '1' && state.revealed) grade('k');
    else if (e.key === '2' && state.revealed) grade('m');
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  rebuild(false);
})();
</script>
