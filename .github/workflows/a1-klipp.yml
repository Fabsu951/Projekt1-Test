# Screen recordings for marketing clip A1 ("Svenska laviner/marknad/manus/A1.md"):
# builds the app from the app branch, records it with sample people/forecasts
# and the real map (cloud sessions can't reach the map servers) and commits
# the mp4 files to "Svenska laviner/marknad/film/A1/" on this branch.

name: A1-klipp

on:
  push:
    branches: [ccr-a4c9657a-dnz9f4]
    paths:
      - "Svenska laviner/marknad/film/a1-klipp.mjs"
      - ".github/workflows/a1-klipp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: claude/bold-lamport-juktha
          path: appsrc
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appsrc/Svenska laviner/app/package-lock.json
      - name: Build the app
        working-directory: appsrc/Svenska laviner/app
        run: |
          npm ci
          npm run build
      - name: Playwright and ffmpeg
        working-directory: appsrc/Svenska laviner/app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Record
        working-directory: appsrc/Svenska laviner/app
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          cp "$GITHUB_WORKSPACE/Svenska laviner/marknad/film/a1-klipp.mjs" scripts/
          node scripts/a1-klipp.mjs "$GITHUB_WORKSPACE/Svenska laviner/marknad/film/A1"
          ls -la "$GITHUB_WORKSPACE/Svenska laviner/marknad/film/A1"
      - name: Commit the clips
        if: ${{ !cancelled() }}
        working-directory: Svenska laviner/marknad/film
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf A1/.[!.]*
          git add -A A1
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "A1 screen recordings (automatic)"
          for i in 1 2 3; do git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0; sleep 5; done
          exit 1
