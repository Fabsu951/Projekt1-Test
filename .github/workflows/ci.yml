name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Svenska laviner/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Svenska laviner/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  worker:
    name: Worker (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Svenska laviner/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Svenska laviner/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
