# Builds the iPhone app on one of GitHub's Macs whenever its native code or
# plugins change, so Swift errors show up without a Mac at home.
#
# Once the App Store Connect secrets exist (steps: "Svenska laviner/APPAR.md",
# § 3), the same run also signs the app and uploads it to TestFlight, where
# it can be installed on the iPhone. Until then only the check runs.
#
# macOS minutes count ten times on a private repository, so this does not run
# for every web change; "Run workflow" on the Actions page builds on demand.

name: iPhone-app

on:
  push:
    branches: [claude/bold-lamport-juktha, svenska-laviner]
    paths:
      - "Svenska laviner/app/ios/**"
      - "Svenska laviner/app/package.json"
      - "Svenska laviner/app/package-lock.json"
      - "Svenska laviner/app/capacitor.config.ts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the number of commits.
          fetch-depth: 0

      - name: Pick the newest Xcode (App Store needs the iOS 26 SDK or later)
        # The image's default was Xcode 16.4 / iOS 18.5 SDK, and App Store
        # Connect refused that upload (2026-11-14).
        run: |
          ls -d /Applications/Xcode*.app
          best=""; best_ver=0
          for app in /Applications/Xcode*.app; do
            ver=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            major=${ver%%.*}
            # Skip betas/release candidates: their builds can't go to the App Store.
            case "$app" in *beta*|*Beta*|*RC*|*_rc*) continue ;; esac
            if [ "$major" -ge 26 ] 2>/dev/null && [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best="$app"; best_ver="$ver"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Xcode 26 or later on this runner – change runs-on to a newer macOS image."
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Svenska laviner/app/package-lock.json

      - name: Web app – install, build, copy into iOS
        working-directory: Svenska laviner/app
        run: |
          npm ci
          npm run build
          rm -rf dist/presskit  # press images are for the website only
          npx cap sync ios

      - name: Firebase settings (push notifications)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "Svenska laviner/app/ios/App/App/GoogleService-Info.plist"
          fi

      - name: Check that the app builds (simulator, unsigned)
        # Reported, never blocks the TestFlight upload: on 2026-11-18 the
        # simulator SDK's own modules (Metal, UIKit) failed to build on the
        # runner while nothing in the app had changed.
        id: simcheck
        continue-on-error: true
        working-directory: Svenska laviner/app/ios/App
        run: |
          set +e
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/sim-build.log" 2>&1
          status=$?
          tail -n 40 "$RUNNER_TEMP/sim-build.log"
          if [ "$status" -ne 0 ]; then
            echo "--- first errors ---"
            grep -n -m 25 -E "error:|fatal error" "$RUNNER_TEMP/sim-build.log" | cut -c1-400
            echo "--- disk ---"; df -h / | tail -1
            xcodebuild -showComponent MetalToolchain 2>&1 | head -5 || true
            echo "### iPhone-simulator" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Simulatorbygget misslyckades** – se loggen (första felen). TestFlight-steget körs ändå." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Start the app in an iPhone simulator
        # A smoke test: does it start without crashing, and does the web view
        # have Cache Storage ("Karta offline")? Reported, never blocks.
        if: steps.simcheck.outcome == 'success'
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*Debug-iphonesimulator/App.app" | head -1)
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch --console-pty "$udid" se.snolage.app > "$RUNNER_TEMP/console.txt" 2>&1 &
          sleep 45
          running=$(xcrun simctl spawn "$udid" launchctl list | grep -c "se.snolage.app" || true)
          xcrun simctl terminate "$udid" se.snolage.app || true
          echo "--- console ---"
          grep -v "^\s*$" "$RUNNER_TEMP/console.txt" | head -n 150
          {
            echo "### iPhone-simulator"
            if [ "$running" -gt 0 ]; then echo "- Appen startade och körde i 45 s."; else echo "- **Appen kördes inte efter 45 s (krasch?)**"; fi
            echo "- $(grep -o '\[Snöläge\][^\"]*' "$RUNNER_TEMP/console.txt" | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: TestFlight – sign and upload
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.APPLE_TEAM_ID != ''
        working-directory: Svenska laviner/app/ios/App
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Manual App Store signing with a certificate + profile fetched
          # through the API (scripts/ios-signing.mjs): Xcode's automatic
          # signing needs a registered test device to archive, and the team
          # has none ("Your team has no devices", first run 2026-11-14).
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          build=$(git rev-list --count HEAD)
          sign="$RUNNER_TEMP/sign"
          mkdir -p "$sign"
          # macOS's own LibreSSL: its .p12 files are ones `security import` accepts.
          /usr/bin/openssl genrsa -out "$sign/key.pem" 2048
          /usr/bin/openssl req -new -key "$sign/key.pem" -out "$sign/csr.pem" -subj "/CN=Snolage CI/C=SE"
          BUNDLE_ID=se.snolage.app node "$GITHUB_WORKSPACE/Svenska laviner/app/scripts/ios-signing.mjs" "$sign/csr.pem" "$sign"
          profile_name=$(cat "$sign/profile-name.txt")
          /usr/bin/openssl x509 -inform DER -in "$sign/cert.cer" -out "$sign/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$sign/key.pem" -in "$sign/cert.pem" -out "$sign/cert.p12" -passout pass:ci
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          curl -fsSL -o "$sign/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$sign/wwdr.cer" -k "$kc" -T /usr/bin/codesign || true
          security import "$sign/cert.p12" -k "$kc" -P ci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          uuid=$(security cms -D -i "$sign/profile.mobileprovision" | plutil -extract UUID raw -)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$sign/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          # Only the app target signs manually (setting it on the command line
          # would hit the Swift packages' resource bundles too); push in an
          # App Store build is "production".
          python3 - "$profile_name" <<'PY'
          import re, sys
          path = "App.xcodeproj/project.pbxproj"
          text = open(path).read()
          start = text.index("504EC3181FED79650016851F /* Release */ = {")
          end = text.index("name = Release;", start)
          block = text[start:end].replace(
              "CODE_SIGN_STYLE = Automatic;",
              'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";' % sys.argv[1],
          )
          open(path, "w").write(text[:start] + block + text[end:])
          PY
          sed -i '' 's#<string>development</string>#<string>production</string>#' App/App.entitlements
          status=0
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$build" \
            OTHER_CODE_SIGN_FLAGS="--keychain $kc" archive > "$RUNNER_TEMP/archive.log" 2>&1 || status=$?
          tail -n 60 "$RUNNER_TEMP/archive.log"
          if [ "$status" -ne 0 ]; then
            echo "--- first errors ---"
            grep -n -m 25 -E "error:|fatal error" "$RUNNER_TEMP/archive.log" | cut -c1-400
            security delete-keychain "$kc" || true
            exit "$status"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>se.snolage.app</key><string>${profile_name}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"
          rm -f "$key"
          security delete-keychain "$kc" || true
          echo "### iPhone-app" >> "$GITHUB_STEP_SUMMARY"
          version=$(grep -m1 "MARKETING_VERSION" App.xcodeproj/project.pbxproj | sed "s/[^0-9.]//g")
          echo "- Version $version ($build) uppladdad till TestFlight. Den syns i TestFlight-appen när Apple har behandlat den (oftast 5–30 min)." >> "$GITHUB_STEP_SUMMARY"
