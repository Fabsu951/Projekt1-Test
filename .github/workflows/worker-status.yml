# Prints the worker's requests per hour and outcome (ok, CPU limit exceeded,
# errors) for the last day from Cloudflare's analytics, with CPU time, and
# the database's rows read/written per day against the free plan's limits
# (5 million read, 100 000 written; queries fail beyond them since
# 2026-09-01) – for when Cloudflare mails about the free plan's limits. Runs when this file
# changes, or by hand via the API (workflows/worker-status.yml/dispatches).

name: Worker-status

on:
  push:
    branches: [claude/bold-lamport-juktha, svenska-laviner]
    paths:
      - ".github/workflows/worker-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dba2a7031f0d281c2f34301d23a315ca
    steps:
      - name: Requests and CPU per hour
        shell: python
        run: |
          import json, os, urllib.request, datetime as dt
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          since = now - dt.timedelta(hours=26)
          query = """
          query($acc: string!, $since: Time!, $until: Time!) {
            viewer { accounts(filter: {accountTag: $acc}) {
              workersInvocationsAdaptive(limit: 2000, filter: {datetime_geq: $since, datetime_leq: $until}, orderBy: [datetimeHour_ASC]) {
                dimensions { scriptName status datetimeHour }
                sum { requests errors subrequests }
                quantiles { cpuTimeP50 cpuTimeP99 }
              }
            } }
          }"""
          body = json.dumps({"query": query, "variables": {
              "acc": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "since": since.isoformat().replace("+00:00", "Z"),
              "until": now.isoformat().replace("+00:00", "Z")}}).encode()
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=body, headers={
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
          data = json.load(urllib.request.urlopen(req))
          if data.get("errors"):
              print("Cloudflare answered with errors (the token may lack Account Analytics: Read):")
              print(json.dumps(data["errors"], indent=2))
              raise SystemExit(1)
          rows = data["data"]["viewer"]["accounts"][0]["workersInvocationsAdaptive"]
          totals = {}
          print(f"{'hour (UTC)':<22}{'worker':<20}{'status':<22}{'requests':>10}{'cpu p50 ms':>12}{'cpu p99 ms':>12}")
          for r in rows:
              d, s, q = r["dimensions"], r["sum"], r["quantiles"]
              key = (d["scriptName"], d["status"])
              totals[key] = totals.get(key, 0) + s["requests"]
              print(f"{d['datetimeHour']:<22}{d['scriptName']:<20}{d['status']:<22}{s['requests']:>10}{q['cpuTimeP50']/1000:>12.1f}{q['cpuTimeP99']/1000:>12.1f}")
          print("\nTotals for the last 26 hours:")
          for (script, status), n in sorted(totals.items(), key=lambda kv: -kv[1]):
              print(f"  {script:<20}{status:<22}{n:>10}")

      - name: Database rows per day
        shell: python
        run: |
          import json, os, urllib.request, datetime as dt
          today = dt.date.today()
          query = """
          query($acc: string!, $since: Date!, $until: Date!) {
            viewer { accounts(filter: {accountTag: $acc}) {
              d1AnalyticsAdaptiveGroups(limit: 100, filter: {date_geq: $since, date_leq: $until}, orderBy: [date_ASC]) {
                dimensions { date databaseId }
                sum { readQueries writeQueries rowsRead rowsWritten }
              }
            } }
          }"""
          body = json.dumps({"query": query, "variables": {
              "acc": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "since": (today - dt.timedelta(days=7)).isoformat(),
              "until": today.isoformat()}}).encode()
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=body, headers={
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
          data = json.load(urllib.request.urlopen(req))
          if data.get("errors"):
              print("Cloudflare answered with errors:")
              print(json.dumps(data["errors"], indent=2))
              raise SystemExit(0)
          rows = data["data"]["viewer"]["accounts"][0]["d1AnalyticsAdaptiveGroups"]
          print(f"{'date':<12}{'reads':>10}{'writes':>10}{'rows read':>14}{'% of 5M':>9}{'rows written':>14}{'% of 100k':>11}")
          for r in rows:
              d, s = r["dimensions"], r["sum"]
              print(f"{d['date']:<12}{s['readQueries']:>10}{s['writeQueries']:>10}{s['rowsRead']:>14}{s['rowsRead']/5e6*100:>8.1f}%{s['rowsWritten']:>14}{s['rowsWritten']/1e5*100:>10.1f}%")


      - name: R2 this month (storage and operations)
        shell: python
        run: |
          import json, os, urllib.request, datetime as dt
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          month = now.replace(day=1, hour=0, minute=0, second=0)
          query = """
          query($acc: string!, $since: Time!, $until: Time!) {
            viewer { accounts(filter: {accountTag: $acc}) {
              ops: r2OperationsAdaptiveGroups(limit: 1000, filter: {datetime_geq: $since, datetime_leq: $until}) {
                dimensions { actionType bucketName }
                sum { requests }
              }
              storage: r2StorageAdaptiveGroups(limit: 100, filter: {datetime_geq: $since, datetime_leq: $until}, orderBy: [datetime_DESC]) {
                dimensions { bucketName datetime }
                max { objectCount payloadSize metadataSize }
              }
            } }
          }"""
          body = json.dumps({"query": query, "variables": {
              "acc": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "since": month.isoformat().replace("+00:00", "Z"),
              "until": now.isoformat().replace("+00:00", "Z")}}).encode()
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=body, headers={
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
          data = json.load(urllib.request.urlopen(req))
          if data.get("errors"):
              print("Cloudflare answered with errors:")
              print(json.dumps(data["errors"], indent=2))
              raise SystemExit(0)
          acc = data["data"]["viewer"]["accounts"][0]
          class_a = {"ListBuckets", "PutBucket", "ListObjects", "PutObject", "CopyObject", "CompleteMultipartUpload",
                     "CreateMultipartUpload", "LifecycleStorageTierTransition", "ListMultipartUploads", "UploadPart",
                     "UploadPartCopy", "ListParts", "PutBucketEncryption", "PutBucketCors", "PutBucketLifecycleConfiguration"}
          totals = {}
          for r in acc["ops"]:
              d = r["dimensions"]
              totals[(d["bucketName"], d["actionType"])] = totals.get((d["bucketName"], d["actionType"]), 0) + r["sum"]["requests"]
          a = sum(n for (b, t), n in totals.items() if t in class_a)
          b = sum(n for (b, t), n in totals.items() if t not in class_a)
          print(f"Since {month.date()}: class A {a:,} ({a/1e6*100:.0f} % of 1 M free), class B {b:,} ({b/1e7*100:.1f} % of 10 M free)")
          for (bucket, t), n in sorted(totals.items(), key=lambda kv: -kv[1])[:20]:
              print(f"  {bucket:<22}{t:<26}{n:>10,}")
          latest = {}
          for r in acc["storage"]:
              latest.setdefault(r["dimensions"]["bucketName"], r["max"])
          total = 0
          for bucket, m in latest.items():
              total += m["payloadSize"] + m["metadataSize"]
              print(f"  {bucket:<22}{m['objectCount']:>10,} objects {m['payloadSize']/1e9:>7.2f} GB")
          print(f"Stored now: {total/1e9:.2f} GB (10 GB-month free)")
