# Screenshots for App Store Connect and Google Play (1320×2868, Swedish and
# English), with sample forecasts and people but the real map from the worker.
# Runs when the screenshot script changes, or by hand; the pictures end up
# as the artifact "butiksbilder" on the run's page.

name: Butiksbilder

on:
  push:
    branches: [claude/bold-lamport-juktha, svenska-laviner]
    paths:
      - "Svenska laviner/app/scripts/store-screenshots.mjs"
      - ".github/workflows/store-screenshots.yml"
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Svenska laviner/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Svenska laviner/app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Take the screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          LANG_UI=sv node scripts/store-screenshots.mjs "$RUNNER_TEMP/butiksbilder"
          LANG_UI=en node scripts/store-screenshots.mjs "$RUNNER_TEMP/butiksbilder"
      - uses: actions/upload-artifact@v4
        with:
          name: butiksbilder
          path: ${{ runner.temp }}/butiksbilder
          retention-days: 30
