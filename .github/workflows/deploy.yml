# Publishes Snöläge (Cloudflare worker + D1 migrations + website) whenever
# the working branch is pushed, so nobody has to run deploy.ps1 by hand.
# Tests and type checks run first; nothing is published if any of them fail.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings → Secrets and
# variables → Actions). Steps for creating it: "Svenska laviner/AUTODEPLOY.md".
# Native apps (Android/iOS) are still built on a computer.

name: Deploy Snöläge

on:
  push:
    branches: [claude/bold-lamport-juktha, svenska-laviner]
    paths:
      - "Svenska laviner/app/**"
      - "Svenska laviner/worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-snolage
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Not secret: it is part of every Cloudflare dashboard URL.
  CLOUDFLARE_ACCOUNT_ID: dba2a7031f0d281c2f34301d23a315ca

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The repository secret CLOUDFLARE_API_TOKEN is missing. See Svenska laviner/AUTODEPLOY.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Svenska laviner/worker/package-lock.json
            Svenska laviner/app/package-lock.json

      - name: Worker – install, typecheck, test
        working-directory: Svenska laviner/worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: App – install, test, build
        working-directory: Svenska laviner/app
        run: |
          npm ci
          npm test
          npm run build

      - name: Database migrations
        working-directory: Svenska laviner/worker
        run: npx wrangler d1 migrations apply fjallkoll --remote

      - name: Map tile bucket (public at kartor.snolage.se)
        working-directory: Svenska laviner/worker
        run: |
          if ! npx wrangler r2 bucket list --jurisdiction eu | grep -q "snolage-kartor"; then
            npx wrangler r2 bucket create snolage-kartor --jurisdiction eu
          fi
          # Lets the site and the apps fetch tiles for offline maps.
          npx wrangler r2 bucket cors set snolage-kartor --file kartor-cors.json --jurisdiction eu --force

      - name: Publish the worker
        working-directory: Svenska laviner/worker
        run: npx wrangler deploy

      - name: Publish the website
        working-directory: Svenska laviner/app
        run: npx --yes wrangler@4 pages deploy dist --project-name=fjallkoll --branch=production --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --format=%s)" --commit-dirty=true

      - name: Summary
        run: |
          {
            echo "### Publicerat"
            echo "- Version: \`$(git log -1 --format='%h %s')\`"
            echo "- Sajt: https://snolage.se"
            echo "- Worker: https://fjallkoll-worker.fabian-n-sund.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
