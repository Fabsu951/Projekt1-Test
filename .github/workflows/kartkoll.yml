# One-off check (removed after): the live map right at the border near
# Ingenmansland/Ohtjevaartoe (Fabian's video 2026-11-04), zoomed in to the
# map's maximum. Finds the border from Kartverket's own tiles, puts the
# position 100 m into Sweden, prints the tiles shown and screenshots (base64).
name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Live map at the border
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i playwright@1.56.1 sharp@0.34 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.mjs <<'EOF'
          import { chromium } from "playwright";
          import sharp from "sharp";
          const KV = (z, x, y) => `https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/${z}/${y}/${x}.png`;
          const n16 = 2 ** 16;
          const tx = (lon) => (lon + 180) / 360 * n16;
          const ty = (lat) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n16; };
          // Kartverket is opaque in Norway, transparent in Sweden: walk east until a pixel is transparent.
          async function borderLon(lat) {
            const y = ty(lat);
            for (let lon = 13.95; lon < 14.35; lon += 0.0005) {
              const x = tx(lon);
              const res = await fetch(KV(16, Math.floor(x), Math.floor(y)));
              const { data, info } = await sharp(Buffer.from(await res.arrayBuffer())).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              const px = Math.floor((x % 1) * info.width), py = Math.floor((y % 1) * info.height);
              if (data[(py * info.width + px) * 4 + 3] < 50) return lon;
            }
            return null;
          }
          const browser = await chromium.launch();
          for (const lat of [64.925, 64.945]) {
            const b = await borderLon(lat);
            console.log(`lat ${lat}: Kartverket ends at lon ${b?.toFixed(4)}`);
            if (b === null) continue;
            const lon = b + 0.002; // ~100 m into Sweden
            const ctx = await browser.newContext({ viewport: { width: 1000, height: 640 }, locale: "sv-SE", geolocation: { latitude: lat, longitude: lon, accuracy: 5 }, permissions: ["geolocation"] });
            await ctx.addInitScript(() => localStorage.setItem("fjallkoll:welcome-done", "1"));
            const page = await ctx.newPage();
            await page.goto("https://snolage.se/karta", { waitUntil: "networkidle" });
            await page.getByRole("button", { name: "Helskärm" }).click();
            await page.getByRole("button", { name: "Visa min position" }).click();
            await page.waitForTimeout(4000);
            for (let step = 0; step <= 6; step++) {
              if (step > 0) { await page.locator(".leaflet-control-zoom-in").click(); await page.waitForTimeout(4000); }
              const info = await page.evaluate(() => {
                const byLayer = {};
                for (const i of document.querySelectorAll(".leaflet-tile-pane img")) {
                  if (!i.getBoundingClientRect().width) continue;
                  const u = new URL(i.src, location.href);
                  const m = u.pathname.match(/(\d+)\/(\d+)\/(\d+)\.png$/);
                  const key = `${u.host.split(".")[0]} z${m ? m[1] : "?"}${i.complete && i.naturalWidth ? "" : " (ej laddad)"}`;
                  byLayer[key] = (byLayer[key] ?? 0) + 1;
                }
                return byLayer;
              });
              console.log(`lat ${lat} step ${step}: ${JSON.stringify(info)}`);
              const small = await sharp(await page.screenshot()).resize(500).jpeg({ quality: 50 }).toBuffer();
              console.log(`IMG b${String(lat).slice(-3)}-${step} ${small.toString("base64")}`);
            }
            await ctx.close();
          }
          await browser.close();
          EOF
          node run.mjs
