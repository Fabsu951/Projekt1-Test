# One-off check (removed after): the live map at the border, zoomed in step
# by step like Fabian's video (2026-11-04), with real tiles. Prints which tile
# URLs the page shows and which failed, and small screenshots (base64).
name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Live map at the border
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i playwright@1.56.1 sharp@0.34 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.mjs <<'EOF'
          import { chromium } from "playwright";
          import sharp from "sharp";
          const SITES = [["korall", 64.902, 14.056], ["rr232", 66.93, 15.97]];
          const browser = await chromium.launch();
          for (const [name, lat, lon] of SITES) {
            const ctx = await browser.newContext({ viewport: { width: 1000, height: 640 }, locale: "sv-SE", geolocation: { latitude: lat, longitude: lon, accuracy: 10 }, permissions: ["geolocation"] });
            await ctx.addInitScript(() => localStorage.setItem("fjallkoll:welcome-done", "1"));
            const page = await ctx.newPage();
            const log = [];
            page.on("requestfailed", (r) => { if (/\.png/.test(r.url())) log.push(`FAILED ${r.url()} ${r.failure()?.errorText}`); });
            page.on("response", (r) => { if (/\.png/.test(r.url()) && r.status() >= 300) log.push(`${r.status()} ${r.url()}`); });
            await page.goto("https://snolage.se/karta", { waitUntil: "networkidle" });
            await page.getByRole("button", { name: "Visa min position" }).click();
            await page.waitForTimeout(4000);
            for (let step = 0; step <= 5; step++) {
              if (step > 0) { await page.locator(".leaflet-control-zoom-in").click(); await page.waitForTimeout(4500); }
              const info = await page.evaluate(() => {
                const imgs = [...document.querySelectorAll(".leaflet-tile-pane img")].filter((i) => i.getBoundingClientRect().width > 0);
                const byLayer = {};
                for (const i of imgs) {
                  const u = new URL(i.src, location.href);
                  const m = u.pathname.match(/(\d+)\/(\d+)\/(\d+)\.png$/);
                  const key = `${u.host}${u.pathname.includes("/tiles/") ? " worker" : ""} z${m ? m[1] : "?"}`;
                  byLayer[key] = (byLayer[key] ?? 0) + 1;
                }
                const frames = document.querySelectorAll(".leaflet-tile-pane div.leaflet-tile").length;
                const zoom = document.querySelector(".leaflet-tile-container:last-child img")?.src ?? "";
                return { byLayer, frames };
              });
              console.log(`${name} step ${step}: ${JSON.stringify(info)}`);
              const shot = await page.screenshot();
              const small = await sharp(shot).resize(500).jpeg({ quality: 50 }).toBuffer();
              console.log(`IMG ${name}-${step} ${small.toString("base64")}`);
            }
            console.log(log.slice(0, 40).join("\n"));
            await ctx.close();
          }
          await browser.close();
          EOF
          node run.mjs
