# One-off look at the map's detail when zoomed in: how detailed Mapterhorn's
# heights (our own slope layer) really are over the Swedish mountains,
# whether the detailed slope tiles exist, and screenshots of the live map at
# high zoom. Cloud sessions can't reach these hosts; this runs when the file
# changes and commits the screenshots to Svenska laviner/kartkoll/.

name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths:
      - ".github/workflows/kartkoll.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kartkoll
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q pillow numpy

      - name: NVE slope tile caches and Mapterhorn sources
        continue-on-error: true
        shell: python
        run: |
          import io, json, math, re, urllib.request
          from PIL import Image
          UA = {"User-Agent": "Snolage/1.0 (https://snolage.se)"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      return r.status, dict(r.headers), r.read()
              except Exception as e:
                  return getattr(e, "code", 0), {}, str(e)[:200].encode()
          s, h, body = get("https://mapterhorn.com/attribution/")
          print("== mapterhorn attribution", s)
          print(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", body.decode("utf-8", "replace")))[:4000])
          s, h, body = get("https://mapterhorn.com/")
          print("== mapterhorn home", s, re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", body.decode("utf-8", "replace")))[:2500])
          def tile(lat, lon, z):
              n = 2 ** z
              r = math.radians(lat)
              return int((lon + 180) / 360 * n), int((1 - math.log(math.tan(r) + 1 / math.cos(r)) / math.pi) / 2 * n)
          for svc in ["https://gis3.nve.no/arcgis/rest/services/wmts/Bratthet_2024/MapServer", "https://gis3.nve.no/arcgis/rest/services/wmts/Bratthet_med_utlop_2024/MapServer", "https://kart.nve.no/enterprise/rest/services/Bratthet/MapServer"]:
              s, h, body = get(svc + "?f=json")
              print("\n==", svc, s)
              try:
                  d = json.loads(body)
              except Exception:
                  print(body[:300]); continue
              ti = d.get("tileInfo") or {}
              print("  name", d.get("mapName"), "| copyright:", d.get("copyrightText"), "| desc:", (d.get("serviceDescription") or d.get("description") or "")[:600])
              print("  sr", d.get("spatialReference"), "single fused cache", d.get("singleFusedMapCache"), "max/min scale", d.get("maxScale"), d.get("minScale"))
              print("  tile sr", ti.get("spatialReference"), "size", ti.get("rows"), ti.get("cols"), "format", ti.get("format"), "origin", ti.get("origin"))
              print("  lods", [(l.get("level"), round(l.get("resolution"), 3)) for l in ti.get("lods", [])])
              print("  fullExtent", d.get("fullExtent"))
              print("  layers", [(l.get("id"), l.get("name")) for l in d.get("layers", [])][:20])
              if ti:
                  for name, lat, lon in [("Narvik NO", 68.43, 17.43), ("Riksgransen NO side", 68.43, 18.05), ("Kebnekaise SE", 67.90, 18.55), ("Sylarna NO side", 63.02, 12.18)]:
                      for z in [10, 12, 14, 15, 16, 17]:
                          x, y = tile(lat, lon, z)
                          u = f"{svc}/tile/{z}/{y}/{x}"
                          st, hh, b = get(u)
                          info = ""
                          if st == 200 and b[:4] in (b"\x89PNG", b"\xff\xd8\xff\xe0") or st == 200:
                              try:
                                  im = Image.open(io.BytesIO(b)).convert("RGBA")
                                  px = list(im.getdata())
                                  info = f"{im.size} transparent {sum(1 for p in px if p[3] == 0) / len(px) * 100:.0f} %, colours {len(set(px))}"
                              except Exception as e:
                                  info = str(e)[:80]
                          print(f"  {name} z{z}: {st} {hh.get('Content-Type')} cors={hh.get('Access-Control-Allow-Origin')} cache={hh.get('Cache-Control')} {len(b)} B {info}")
              s, h, body = get(svc + "/legend?f=json")
              try:
                  for lyr in json.loads(body).get("layers", []):
                      print("  legend", lyr.get("layerName"), [(l.get("label"), l.get("url")) for l in lyr.get("legend", [])])
              except Exception:
                  pass

      - uses: actions/checkout@v4

      - name: Screenshots of the live map
        if: false
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots
          npm init -y >/dev/null
          npm i -s playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
          cat > shots.mjs <<'EOF'
          import { chromium } from "playwright";
          const out = process.argv[2];
          const merc = (lat, lon, z) => { const n = 256 * 2 ** z; const r = lat * Math.PI / 180; return [(lon + 180) / 360 * n, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n]; };
          const browser = await chromium.launch();
          const scenarios = [
            { name: "karta", layer: null, zooms: [13, 14, 15, 16, 17] },
            { name: "egen-lutning", layer: /Lutning, egen beräkning/, zooms: [12, 13, 14, 15, 16] },
            { name: "nv-lutning", layer: /^Lutning$/, zooms: [12, 13, 14, 15, 16] },
            { name: "detaljerad-lutning", layer: /Lutning, detaljerad/, zooms: [12, 13, 14, 15, 16] },
          ];
          for (const s of scenarios) {
            const page = await browser.newPage({ viewport: { width: 1000, height: 700 }, locale: "sv-SE" });
            await page.addInitScript(() => { try { localStorage.setItem("fjallkoll:welcome-done", "1"); localStorage.setItem("fjallkoll:language", "sv"); } catch {} });
            await page.goto("https://snolage.se/karta", { waitUntil: "networkidle" });
            await page.waitForSelector(".leaflet-container img.leaflet-tile");
            await page.getByRole("button", { name: "Helskärm" }).click();
            await page.waitForTimeout(1500);
            const layersButton = page.getByRole("button", { name: /Kartlager/ });
            const setPanel = async (open) => { if (((await layersButton.getAttribute("aria-expanded")) === "true") !== open) await layersButton.click(); await page.waitForTimeout(300); };
            await setPanel(true);
            if (s.layer) {
              const box = page.getByRole("checkbox", { name: s.layer }).or(page.getByRole("radio", { name: s.layer }));
              if (!(await box.count())) { console.log(s.name, "– no such layer on the page"); await page.close(); continue; }
              await box.first().check();
            }
            await setPanel(false);
            const vb = await page.locator(".leaflet-container").boundingBox();
            const [cx, cy] = merc(65.6, 15.2, 5), [px, py] = merc(67.90, 18.55, 5);
            const x = vb.x + vb.width / 2 + (px - cx), y = vb.y + vb.height / 2 + (py - cy);
            for (let z = 6; z <= Math.max(...s.zooms); z++) {
              await page.mouse.dblclick(x, y);
              await page.waitForTimeout(z >= 12 ? 3500 : 1200);
              if (s.zooms.includes(z)) {
                await page.waitForLoadState("networkidle").catch(() => {});
                await page.screenshot({ path: `${out}/${s.name}-z${z}.jpg`, type: "jpeg", quality: 72 });
                console.log("saved", s.name, z);
              }
            }
            await page.close();
          }
          await browser.close();
          EOF
          OUT="$GITHUB_WORKSPACE/Svenska laviner/kartkoll"
          mkdir -p "$OUT"
          node shots.mjs "$OUT"

      - name: Commit the screenshots
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "Svenska laviner/kartkoll"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Kartkoll screenshots (automatic)"
          for i in 1 2 3; do git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0; sleep 5; done
          exit 1
