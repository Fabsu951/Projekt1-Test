# One-off check (removed after): are Kartverket's tiles transparent over
# Sweden near the border at every zoom? Fetches Kartverket + our Lantmäteriet
# tiles around Korallgrottan and border cairn 232 at zoom 12–16, prints the
# share of opaque pixels on the Swedish side and small mosaics (base64).
name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch and compare
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i sharp@0.34 >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import sharp from "sharp";
          const KV = (z, x, y) => `https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/${z}/${y}/${x}.png`;
          const LM = (z, x, y) => `https://kartor.snolage.se/topowebb/${z}/${x}/${y}.png`;
          const tile = (lat, lon, z) => { const n = 2 ** z, r = lat * Math.PI / 180; return [Math.floor((lon + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)]; };
          async function get(url) {
            const t0 = Date.now();
            const res = await fetch(url);
            const ms = Date.now() - t0;
            if (!res.ok) return { status: res.status, ms, buf: null };
            return { status: res.status, ms, buf: Buffer.from(await res.arrayBuffer()) };
          }
          async function alpha(buf) {
            const { data, info } = await sharp(buf).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            let opaque = 0; const n = info.width * info.height;
            for (let i = 3; i < data.length; i += 4) if (data[i] > 200) opaque++;
            return Math.round(100 * opaque / n);
          }
          // [name, lat, lon]: a point on the Swedish side, ~1–4 km from the border.
          // Kartverket's opacity along a line across the border near Korallgrottan, zoom 14 and 16.
          for (const z of [14, 16]) {
            let last = -1;
            const out = [];
            for (let lon = 13.90; lon <= 14.20; lon += 0.002) {
              const [x, y] = tile(64.90, lon, z);
              if (x === last) continue;
              last = x;
              const kv = await get(KV(z, x, y));
              const a = kv.buf ? await alpha(kv.buf) : null;
              out.push(`${lon.toFixed(3)}:${a}%`);
              if (z === 16 && a !== null && a > 0 && a < 100) {
                const img = await sharp(kv.buf).flatten({ background: "#ff00ff" }).resize(200, 200).jpeg({ quality: 55 }).toBuffer();
                console.log(`IMG kv${x} ${img.toString("base64")}`);
              }
            }
            console.log(`z${z} ` + out.join(" "));
          }
          EOF
          node check.mjs
