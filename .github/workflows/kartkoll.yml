# One-off check (removed after): NVE's "Bratthet med utløp" service – layers,
# legend and the colours in a tile over Lyngen – before the app shows it.
name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: NVE runout legend colours
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i sharp@0.34 >/dev/null 2>&1
          cat > run.mjs <<'JS'
          import sharp from "sharp";
          const res = await fetch("https://gis3.nve.no/arcgis/rest/services/wmts/Bratthet_med_utlop_2024/MapServer/legend?f=json");
          const { layers } = await res.json();
          for (const layer of layers) {
            for (const item of layer.legend) {
              const { data, info } = await sharp(Buffer.from(item.imageData, "base64")).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              const i = ((info.height >> 1) * info.width + (info.width >> 1)) * 4;
              console.log(layer.layerId, layer.layerName, "label", item.label, "centre", `${data[i]},${data[i + 1]},${data[i + 2]},${data[i + 3]}`);
            }
          }
          JS
          node run.mjs
