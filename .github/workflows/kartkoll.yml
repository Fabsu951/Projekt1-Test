# One-off: Norway's outline grown to cover islands and coast (Natural Earth 10m) for
# the map's "is this tile in Norway" test. Removed afterwards.
name: Kartkoll
on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install shapely==2.0.6
      - name: Outlines
        run: |
          curl -sL --retry 3 https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson -o ne.json
          python3 - <<'PY'
          import json
          from shapely.geometry import shape, mapping
          fs=json.load(open("ne.json"))["features"]
          # Norway with its islands and coastal waters: every part, grown by ~0.25°, one ring.
          g=shape(next(f for f in fs if f["properties"]["ADM0_A3"]=="NOR")["geometry"])
          b=g.buffer(0.25).simplify(0.05,preserve_topology=True)
          parts=list(b.geoms) if b.geom_type=="MultiPolygon" else [b]
          main=max(parts,key=lambda p:p.area)
          ring=[[round(x,2),round(y,2)] for x,y in main.exterior.coords]
          print("NORBUF parts",len(parts),"points",len(ring),"holes",len(main.interiors))
          print("RING_NORBUF", json.dumps(ring,separators=(",",":")))
          PY
