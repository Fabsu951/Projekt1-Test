# One-off: fetch overview tiles (Lantmäteriet + Kartverket, zoom 4–6) and print
# them as base64 so a cloud session can look at them. Removed afterwards.
name: Kartkoll
on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]
permissions:
  contents: read
jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get() { # z x y
            for src in lm kv; do
              if [ $src = lm ]; then u="https://kartor.snolage.se/topowebb/$1/$2/$3.png"; else u="https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/$1/$3/$2.png"; fi
              code=$(curl -s -o t.png -w '%{http_code}' "$u")
              echo "TILE $src $1 $2 $3 $code $(base64 -w0 t.png)"
            done
          }
          for x in 7 8 9; do for y in 3 4; do get 4 $x $y; done; done
          for x in $(seq 15 19); do for y in $(seq 6 9); do get 5 $x $y; done; done
          for x in $(seq 32 37); do for y in $(seq 14 18); do get 6 $x $y; done; done
