# One-off check (removed after): what colour are Lantmäteriet's tiles over
# Norway (zoom 4–16), and Kartverket's flat strip over Sweden? Prints the
# pixel colour counts of a few tiles.
name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Colours
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i sharp@0.34 >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import sharp from "sharp";
          const KV = (z, x, y) => `https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/${z}/${y}/${x}.png`;
          const LM = (z, x, y) => `https://kartor.snolage.se/topowebb/${z}/${x}/${y}.png`;
          const W = (z, x, y) => `https://fjallkoll-worker.fabian-n-sund.workers.dev/tiles/topowebb/${z}/${x}/${y}.png`;
          const tile = (lat, lon, z) => { const n = 2 ** z, r = lat * Math.PI / 180; return [Math.floor((lon + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)]; };
          async function colours(url) {
            const res = await fetch(url, { redirect: "manual" });
            if (!res.ok) return `${res.status}`;
            const { data } = await sharp(Buffer.from(await res.arrayBuffer())).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const count = new Map();
            for (let i = 0; i < data.length; i += 4) { const k = `${data[i]},${data[i + 1]},${data[i + 2]},${data[i + 3]}`; count.set(k, (count.get(k) ?? 0) + 1); }
            const total = data.length / 4;
            return [...count].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => `${k}:${Math.round(100 * n / total)}%`).join(" ");
          }
          // Inside Norway (Lantmäteriet over Norway), at several zooms.
          for (const [name, lat, lon] of [["norge-korall", 64.90, 13.90], ["sulitjelma", 67.12, 16.05], ["lyngen", 69.58, 20.20]]) {
            for (const z of [4, 6, 7, 8, 10, 12, 14, 15, 16]) {
              const [x, y] = tile(lat, lon, z);
              const lm = await colours(z <= 7 ? LM(z, x, y) : W(z, x, y));
              console.log(`LM over Norway ${name} z${z}: ${lm}`);
            }
          }
          // Kartverket's strip over Sweden near Korallgrottan.
          for (const z of [14, 15, 16]) {
            const [x, y] = tile(64.90, 14.05, z);
            console.log(`KV strip z${z}: ${await colours(KV(z, x, y))}`);
          }
          EOF
          node check.mjs
