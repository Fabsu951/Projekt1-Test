# One-off check (removed after): does Kartverket's topo cache have real
# detail at zoom 16, or only a flat fill? Kartverket zoom 15 tile vs its four
# zoom-16 children at a few Norwegian points near the border (base64 images).
name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Kartverket zoom 15 vs 16
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i sharp@0.34 >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import sharp from "sharp";
          const KV = (z, x, y) => `https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/${z}/${y}/${x}.png`;
          const tile = (lat, lon, z) => { const n = 2 ** z, r = lat * Math.PI / 180; return [Math.floor((lon + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)]; };
          async function get(url) { const res = await fetch(url); return res.ok ? Buffer.from(await res.arrayBuffer()) : null; }
          const SITES = [["norge-korall", 64.90, 13.98], ["sulitjelma", 67.12, 16.05], ["lyngen", 69.58, 20.20], ["tromso", 69.65, 18.96]];
          for (const [name, lat, lon] of SITES) {
            const [x, y] = tile(lat, lon, 15);
            const parent = await get(KV(15, x, y));
            const layers = [];
            if (parent) layers.push({ input: await sharp(parent).resize(256, 256).png().toBuffer(), left: 0, top: 0 });
            const sizes = [];
            for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
              const b = await get(KV(16, 2 * x + dx, 2 * y + dy));
              sizes.push(b?.length ?? 0);
              if (b) layers.push({ input: await sharp(b).resize(128, 128).png().toBuffer(), left: 256 + dx * 128, top: dy * 128 });
            }
            const z17 = await get(KV(17, 4 * x, 4 * y));
            console.log(`${name}: z15 ${parent?.length ?? 0} B, z16 ${sizes.join("/")} B, z17 ${z17?.length ?? "none"}`);
            const img = await sharp({ create: { width: 512, height: 256, channels: 3, background: "#ff00ff" } }).composite(layers).jpeg({ quality: 55 }).toBuffer();
            console.log(`IMG ${name} ${img.toString("base64")}`);
          }
          EOF
          node check.mjs
