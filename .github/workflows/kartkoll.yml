# Looks at map tiles near the Swedish–Norwegian border: whether
# Lantmäteriet's tiles (kartor.snolage.se) are transparent or filled over
# Norway, and which address Kartverket's open topo map answers on. Cloud
# sessions can't reach these hosts; this runs when the file changes.

name: Kartkoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths:
      - ".github/workflows/kartkoll.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q pillow

      - name: Tiles at the border
        shell: python
        run: |
          import io, urllib.request
          from PIL import Image
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Snolage/1.0 (https://snolage.se)"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.headers.get("Content-Type"), r.read()
              except Exception as e:
                  return getattr(e, "code", 0), str(e)[:120], b""
          def describe(name, url):
              status, ctype, body = get(url)
              info = f"{status} {ctype} {len(body)} B"
              if body[:4] == b"\x89PNG" or body[:3] == b"\xff\xd8\xff":
                  im = Image.open(io.BytesIO(body)).convert("RGBA")
                  px = list(im.getdata())
                  n = len(px)
                  clear = sum(1 for p in px if p[3] < 10) / n
                  white = sum(1 for p in px if p[3] > 200 and min(p[:3]) > 245) / n
                  info += f" | {im.size} transparent {clear:.0%} white {white:.0%}"
              print(f"{name:<34}{info}\n    {url}")
          for name, (z, x, y) in {'Kiruna z4': (4, 8, 3), 'Kiruna z5': (5, 17, 7), 'Kiruna z6': (6, 35, 15), 'Kiruna z7': (7, 71, 30), 'Kiruna z8': (8, 142, 61), 'Kiruna z9': (9, 284, 123), 'Kiruna z11': (11, 1139, 492), 'Kiruna z13': (13, 4556, 1969), 'Östersund z4': (4, 8, 4), 'Östersund z5': (5, 17, 8), 'Östersund z6': (6, 34, 17), 'Östersund z7': (7, 69, 34), 'Östersund z8': (8, 138, 69), 'Östersund z9': (9, 276, 139), 'Östersund z11': (11, 1107, 556), 'Östersund z13': (13, 4429, 2226), 'Tromsø (NO) z4': (4, 8, 3), 'Tromsø (NO) z5': (5, 17, 7), 'Tromsø (NO) z6': (6, 35, 14), 'Tromsø (NO) z7': (7, 70, 29), 'Tromsø (NO) z8': (8, 141, 58), 'Tromsø (NO) z9': (9, 282, 116), 'Tromsø (NO) z11': (11, 1131, 464), 'Tromsø (NO) z13': (13, 4527, 1856), 'Stockholm z4': (4, 8, 4), 'Stockholm z5': (5, 17, 9), 'Stockholm z6': (6, 35, 18), 'Stockholm z7': (7, 70, 37), 'Stockholm z8': (8, 140, 75), 'Stockholm z9': (9, 281, 150), 'Stockholm z11': (11, 1126, 602), 'Stockholm z13': (13, 4507, 2409)}.items():
              describe("KV " + name, f"https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png")
          tiles = {"border Riksgränsen z12": (12, 2253, 966), "Norway Narvik z12": (12, 2248, 967), "Sweden Abisko z12": (12, 2261, 969), "border Riksgränsen z10": (10, 563, 241)}
          for name, (z, x, y) in tiles.items():
              describe("LM " + name, f"https://kartor.snolage.se/topowebb/{z}/{x}/{y}.png")
              describe("KV rest " + name, f"https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png")
              describe("KV kvp " + name, f"https://cache.kartverket.no/v1/service?service=WMTS&request=GetTile&version=1.0.0&layer=topo&style=default&format=image/png&tilematrixset=webmercator&tilematrix={z}&tilerow={y}&tilecol={x}")
          status, ctype, body = get("https://cache.kartverket.no/v1/wmts/1.0.0/WMTSCapabilities.xml")
          print("capabilities (rest):", status, ctype, len(body))
          if not body:
              status, ctype, body = get("https://cache.kartverket.no/v1/service?service=WMTS&request=GetCapabilities")
              print("capabilities (kvp):", status, ctype, len(body))
          text = body.decode("utf-8", "replace")
          import re
          print("layers:", sorted(set(re.findall(r"<ows:Identifier>([^<]+)</ows:Identifier>", text)))[:60])
          print("resource urls:", sorted(set(re.findall(r'template="([^"]+)"', text)))[:10])
          print("access constraints:", re.findall(r"<ows:AccessConstraints>([^<]+)<", text)[:3])

      - name: Kartverket headers (CORS for offline saving, caching)
        run: |
          curl -sS -D - -o /dev/null -H "Origin: https://snolage.se" "https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/12/967/2248.png" | grep -iE "^(HTTP|access-control|cache-control|content-type|cf-cache|age|expires)"
          echo "--- tile over Sweden (transparent):"
          curl -sS -D - -o /dev/null -H "Origin: https://snolage.se" "https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/12/969/2261.png" | grep -iE "^(HTTP|access-control|cache-control)"
          echo "--- max zoom:"
          for z in 15 16 17 18; do curl -s -o /dev/null -w "z$z %{http_code} %{size_download}\n" "https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/$z/$((967*2**(z-12)))/$((2248*2**(z-12))).png"; done

