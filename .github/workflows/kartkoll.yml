# One-off: simplified outlines of Sweden and Norway (Natural Earth 10m) for
# the map's "is this tile in Norway" test. Removed afterwards.
name: Kartkoll
on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/kartkoll.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install shapely==2.0.6
      - name: Outlines
        run: |
          curl -sL --retry 3 https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson -o ne.json
          python3 - <<'PY'
          import json
          from shapely.geometry import shape, mapping
          fs=json.load(open("ne.json"))["features"]
          for code in ("SWE","NOR"):
              g=shape(next(f for f in fs if f["properties"]["ADM0_A3"]==code)["geometry"])
              polys=list(g.geoms) if g.geom_type=="MultiPolygon" else [g]
              main=max(polys,key=lambda p:p.area)
              s=main.simplify(0.01,preserve_topology=True)
              ring=[[round(x,3),round(y,3)] for x,y in s.exterior.coords]
              print(code,"points",len(main.exterior.coords),"->",len(ring),"area",round(main.area,2),"bounds",main.bounds)
              print("RING_"+code, json.dumps(ring,separators=(",",":")))
          PY
