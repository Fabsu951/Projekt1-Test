# Tests "Dela position" in the real Android app, in an emulator: a share
# keeps sending from ShareLocationService with the app in the background, and
# "Stoppa" in its notification ends it (scripts/play-video/check-share.mjs,
# server.mjs standing in for the worker). Runs when the sharing code or the
# native Android code changes, and before every Google Play build
# (android-release.yml calls it), so a bug like 1.0.5's – the background
# sender never started – never reaches the testers again.

name: Android-test, dela position

on:
  push:
    branches: [claude/bold-lamport-juktha, svenska-laviner]
    paths:
      - ".github/workflows/android-e2e.yml"
      - "Svenska laviner/app/android/**"
      - "Svenska laviner/app/capacitor.config.ts"
      - "Svenska laviner/app/scripts/play-video/**"
      - "Svenska laviner/app/src/services/nativeShare.ts"
      - "Svenska laviner/app/src/services/locationShare.ts"
      - "Svenska laviner/app/src/components/LocationShareBridge.tsx"
      - "Svenska laviner/app/src/pages/SharePositionPage.tsx"
  workflow_call:
  workflow_dispatch:

concurrency:
  # Called from the release build, github.workflow is that workflow's name.
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Svenska laviner/app
    steps:
      # The emulator needs ~7.5 GB for its data partition; the runner has
      # less left after the build unless the unused toolchains go first.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Svenska laviner/app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Demo build – talks to the demo server over plain http
        env:
          VITE_MAP_PROXY_URL: http://10.0.2.2:8787
          VITE_TILE_DIRECT_URL: ""
        run: |
          npm ci
          npm run build
          sed -i "s|  backgroundColor: '#0b1722',|  backgroundColor: '#0b1722',\n  android: { allowMixedContent: true },|" capacitor.config.ts
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          rm -rf dist/presskit  # press images are for the website only
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Playwright (Android support only, no browsers)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save playwright@1.55.0

      - name: Demo server
        run: |
          nohup node scripts/play-video/server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8787/auth/me

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Share in the background, in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 34
          # Plain Android: the Google Play services image kept crashing on first boot and taking the app with it.
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          disk-size: 4096M
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: Svenska laviner/app
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node scripts/play-video/check-share.mjs "$RUNNER_TEMP/check-share-fel.png"

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dela-position-test
          path: ${{ runner.temp }}/check-share-fel.png
          if-no-files-found: ignore
