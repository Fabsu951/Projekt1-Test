# One-off check (removed after): full seNorge GridTimeSeries answers for the
# app's areas, cell heights around each area centre (to pick a mountain
# cell), and SMHI snow1g's frozen-precipitation values with their units.
name: Snökoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/snokoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Snow sources
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i proj4@2 >/dev/null 2>&1
          cat > check.mjs <<'JS'
          import proj4 from "proj4";
          const AREAS = [["kebnekaise", 67.9, 18.55], ["riksgrans", 68.42, 18.13], ["vindel", 65.82, 15.08], ["sodralappland", 65.28, 14.7], ["jamtland", 63.4, 13.08], ["harjedalen", 62.78, 12.8]];
          const utm = "+proj=utm +zone=33 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs";
          const day = (d) => new Date(Date.now() + d * 864e5).toISOString().slice(0, 10);
          async function get(url) { try { const r = await fetch(url, { headers: { "User-Agent": "Snolage/1.0 (+https://snolage.se)" } }); const t = await r.text(); let b; try { b = JSON.parse(t); } catch { b = t.slice(0, 200); } return { status: r.status, body: b }; } catch (e) { return { status: 0, body: String(e) }; } }
          console.log("=== Full answer, kebnekaise sd, -7..+2 days ===");
          const [kx, ky] = proj4("WGS84", utm, [18.55, 67.9]).map(Math.round);
          console.log(kx, ky);
          const full = await get(`https://gts.nve.no/api/GridTimeSeries/${kx}/${ky}/${day(-7)}/${day(2)}/sd.json`);
          console.log(full.status, JSON.stringify(full.body).slice(0, 1500));
          for (const th of ["sdfsw", "sdfsw3d", "sdfsw7d", "additionalSnowDepth"]) {
            const r = await get(`https://gts.nve.no/api/GridTimeSeries/${kx}/${ky}/${day(-7)}/${day(0)}/${th}.json`);
            console.log(th, r.status, JSON.stringify(r.body?.Data ?? r.body).slice(0, 300), "unit", r.body?.Unit);
          }
          console.log("\n=== Cell heights around each centre (sd today) ===");
          for (const [name, lat, lon] of AREAS) {
            const rows = [];
            for (let dy = 2; dy >= -2; dy--) {
              const row = [];
              for (let dx = -2; dx <= 2; dx++) {
                const la = lat + dy * 0.06, lo = lon + dx * 0.14;
                const [x, y] = proj4("WGS84", utm, [lo, la]).map(Math.round);
                const r = await get(`https://gts.nve.no/api/GridTimeSeries/${x}/${y}/${day(-1)}/${day(0)}/sd.json`);
                row.push(r.status === 200 ? `${la.toFixed(2)},${lo.toFixed(2)}:${r.body.Altitude}m/${JSON.stringify(r.body.Data)}` : `${la.toFixed(2)},${lo.toFixed(2)}:HTTP${r.status}`);
              }
              rows.push(row.join("  "));
            }
            console.log(`\n${name} (${lat}, ${lon})\n` + rows.join("\n"));
          }
          console.log("\n=== SMHI snow1g frozen precipitation, Kebnekaise ===");
          const s = await get("https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/18.55/lat/67.9/data.json");
          console.log("HTTP", s.status, "approved", s.body?.approvedTime, "geometry", JSON.stringify(s.body?.geometry));
          for (const e of (s.body?.timeSeries ?? []).slice(0, 80)) {
            const d = e.data;
            console.log(e.time, "t", d.air_temperature, "pmean", d.precipitation_amount_mean, "pmin", d.precipitation_amount_min, "pmax", d.precipitation_amount_max, "frozen", d.precipitation_frozen_part, "pfrozen", d.probability_of_frozen_precipitation, "pprec", d.probability_of_precipitation, "sym", d.symbol_code);
          }
          const keys = new Set(); for (const e of s.body?.timeSeries ?? []) for (const k of Object.keys(e.data ?? {})) keys.add(k);
          console.log("keys:", [...keys].join(", "));
          const sp = await get("https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/parameter.json");
          console.log("parameter doc", sp.status, JSON.stringify(sp.body).slice(0, 4000));
          JS
          node check.mjs
