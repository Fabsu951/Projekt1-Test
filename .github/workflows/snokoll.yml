# One-off check (removed after): what do open snow-depth sources return for
# Snöläge's areas? Open-Meteo (several models), NVE seNorge (GridTimeSeries)
# and the keys in SMHI's snow1g point forecast. Prints numbers only.
name: Snökoll

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths: [".github/workflows/snokoll.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Snow depth sources
        run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i proj4@2 >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import proj4 from "proj4";
          const AREAS = [
            ["Kebnekaisefjällen", 67.90, 18.55], ["Riksgränsfjällen", 68.42, 18.13], ["Västra Vindelfjällen", 65.82, 15.08],
            ["Södra Lapplandsfjällen", 65.28, 14.70], ["Södra Jämtlandsfjällen", 63.40, 13.08], ["Västra Härjedalsfjällen", 62.78, 12.80],
          ];
          const NORWAY = [["Sulitjelma (N)", 67.12, 16.05], ["Narvikfjellet (N)", 68.43, 17.50], ["Lyngen (N)", 69.58, 20.20], ["Sylan norsk sida (N)", 63.02, 12.10]];
          async function json(url) {
            const t0 = Date.now();
            try {
              const r = await fetch(url, { headers: { "User-Agent": "Snolage-check/1.0" } });
              const text = await r.text();
              let body = null; try { body = JSON.parse(text); } catch { body = text.slice(0, 300); }
              return { status: r.status, ms: Date.now() - t0, body };
            } catch (e) { return { status: 0, ms: Date.now() - t0, body: String(e) }; }
          }
          const MODELS = ["best_match", "ecmwf_ifs025", "ecmwf_ifs", "icon_seamless", "metno_seamless", "dmi_seamless", "gfs_seamless"];
          console.log("\n=== NVE seNorge GridTimeSeries ===");
          const themes = await json("https://gts.nve.no/api/GridTimeSeries/Themes/json");
          console.log(`themes: HTTP ${themes.status}`);
          if (Array.isArray(themes.body)) for (const t of themes.body) if (/sd|snow|sno|fsw|swe|qsw/i.test(JSON.stringify(t))) console.log("  " + JSON.stringify(t).slice(0, 220));
          const utm = "+proj=utm +zone=33 +ellps=WGS84 +datum=WGS84 +units=m +no_defs";
          const today = new Date().toISOString().slice(0, 10), weekAgo = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
          for (const [name, lat, lon] of [...AREAS, ["Inland Sverige: Arvidsjaur", 65.59, 19.17], ["Inland Sverige: Östersund", 63.18, 14.64], ["Lappland mitt i: Kvikkjokk", 66.95, 17.72]]) {
            const [x, y] = proj4("WGS84", utm, [lon, lat]).map(Math.round);
            for (const theme of ["sd", "fsw"]) {
              const r = await json(`https://gts.nve.no/api/GridTimeSeries/${x}/${y}/${weekAgo}/${today}/${theme}.json`);
              const d = typeof r.body === "object" && r.body ? r.body : null;
              console.log(`${name} ${theme}: HTTP ${r.status} ${d ? `unit ${d.Unit ?? d.unit} alt ${d.Altitude ?? ""} nodata ${d.NoDataValue ?? ""} data ${JSON.stringify(d.Data ?? d.data)?.slice(0, 120)}` : String(r.body).slice(0, 150)}`);
            }
          }
          EOF
          node check.mjs
