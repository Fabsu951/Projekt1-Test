# Removes the old copies of the map tiles in fjallkoll-images (maptiles/…),
# left over from before the tiles moved to snolage-kartor (2026-10-19).
# First a dry run over everything; only if every old tile has a copy of
# the same size in snolage-kartor does the second pass delete them
# (POST /admin/tiles/cleanup checks each one again before deleting).
# Photos, tracks, avatars and backups are never touched.

name: Rensa gamla kartkopior

on:
  push:
    branches: [claude/bold-lamport-juktha]
    paths:
      - ".github/workflows/kartor-rensa.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: kartor-rensa
  cancel-in-progress: false

env:
  WORKER: https://fjallkoll-worker.fabian-n-sund.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: dba2a7031f0d281c2f34301d23a315ca

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: Svenska laviner/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Wait for this commit's worker deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            state=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" --jq '[.workflow_runs[] | select(.name == "Deploy Snöläge") | "\(.status)/\(.conclusion)"][0] // "none"')
            echo "deploy: $state"
            case "$state" in completed/success) exit 0 ;; completed/*) exit 1 ;; esac
            sleep 20
          done
          exit 1

      - name: Fresh upload token
        run: |
          token=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')
          echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put TILE_UPLOAD_TOKEN
          echo "TILE_UPLOAD_TOKEN=$token" >> "$GITHUB_ENV"
          sleep 15

      - name: Check, then delete
        shell: python
        run: |
          import json, os, re, time, urllib.request
          url = os.environ["WORKER"] + "/admin/tiles/cleanup"
          def call(body):
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={
                          "Authorization": "Bearer " + os.environ["TILE_UPLOAD_TOKEN"], "Content-Type": "application/json",
                          "User-Agent": "Snolage-admin/1.0 (https://snolage.se)"})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return json.load(r)
                  except Exception as e:
                      print("  retry after", e); time.sleep(5 * (attempt + 1))
              raise SystemExit("worker kept failing")
          def listing(which):
              out, cursor = {}, None
              while True:
                  res = call({"list": which, "cursor": cursor})
                  out.update({k: size for k, size in res["objects"]})
                  cursor = res["cursor"]
                  if not cursor: return out
          old = listing("old")
          new = listing("new")
          print(f"old copies: {len(old):,} keys, {sum(old.values())/1e9:.2f} GB; map bucket: {len(new):,} keys")
          tile = re.compile(r"^maptiles/(topowebb|slope)/(\d{1,2})/(\d{1,6})/(\d{1,6})$")
          safe, kept = [], []
          for key, size in old.items():
              m = tile.match(key)
              copy = f"{m[1]}/{m[2]}/{m[3]}/{m[4]}.png" if m else None
              (safe if copy and new.get(copy) == size else kept).append(key)
          print(f"identical copy for {len(safe):,}, no identical copy for {len(kept):,}")
          for k in kept[:50]: print("  kept:", k, old[k], "copy:", new.get(k))
          if kept:
              raise SystemExit("Some old keys have no identical copy – nothing deleted. Look at the list above.")
          deleted = 0
          for i in range(0, len(safe), 1000):
              deleted += call({"delete": safe[i:i + 1000]})["deleted"]
              if (i // 1000) % 50 == 0: print(f"  deleted {deleted:,}")
          left = listing("old")
          print(f"Done: deleted {deleted:,} old tile copies ({sum(old.values())/1e9:.2f} GB). Left under maptiles/: {len(left):,}")
